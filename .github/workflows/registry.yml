name: build-registry

on:
  schedule:
    # v1.6：每 30 分钟增量一次（pushed+created 双通道，单次 <10 分钟）
    - cron: "*/30 * * * *"
    # 每天 04:00 UTC（北京时间 12:00）全量重建，刷新 star 数等静态数据
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "全量重建（默认增量）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-registry
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build DSH registry (full)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true' || github.event.schedule == '0 4 * * *' }}
        run: node scripts/build-registry.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_REGISTRY: https://registry.npmjs.org

      - name: Build DSH registry (incremental)
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true' || github.event.schedule == '0 4 * * *') }}
        run: INCREMENTAL_DAYS=1 node scripts/build-registry.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_REGISTRY: https://registry.npmjs.org

      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 并发运行竞态修复（v1.5）：每日全量 04:00 UTC 与每 2h 增量可能同时收尾，
          # 两个运行各自在旧 checkout 上 commit，后 push 的会被 "fetch first" 拒绝，
          # 导致刚重建的数据整体丢失（2026-08-20 全量两次因此白跑）。
          # 改为：fetch 最新 remote → reset --soft 把本次重建的文件以最新 main
          # 为基底重新提交（产物文件由构建整体覆盖，不会冲突）→ push 带重试。
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --soft origin/main
            git add registry.json registry.json.gz drift-report.json installability-report.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "no changes"
              exit 0
            fi
            git commit -m "registry: $(date -u +%F)"
            if git push; then
              echo "pushed"
              exit 0
            fi
            echo "push rejected by a concurrent run; retrying ($attempt/3)"
          done
          echo "push failed after 3 attempts"
          exit 1

